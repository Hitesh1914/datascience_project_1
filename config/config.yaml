# Configuration file for the data ingestion pipeline
artifacts_roots: artifacts # Root directory for all artifacts

data_ingestion:
  root_dir: artifacts/data_ingestion # Root directory for data ingestion artifacts
  source_URL: https://github.com/krishnaik06/datasets/raw/refs/heads/main/winequality-data.zip  # URL to download the dataset
  local_data_file: artifacts/data_ingestion/winequality_data.zip # Local path where the data will be downloaded
  unzip_dir: artifacts/data_ingestion   # Directory where the data will be unzipped
  

data_validation:
  root_dir: artifacts/data_validation # Root directory for data validation artifacts
  unzip_data_dir: artifacts/data_ingestion/winequality-red.csv # Directory where the data is unzipped
  STATUS_FILE: artifacts/data_validation/status.txt # File to store validation status
  

data_transformation:
  root_dir: artifacts/data_transformation # Root directory for data transformation artifacts
  data_path: artifacts/data_ingestion/winequality-red.csv # Path to the data file for transformation

model_trainer:
  root_dir: artifacts/model_trainer # Root directory for model training artifacts
  train_data_path: artifacts/data_transformation/train.csv # Path to the training data
  test_data_path: artifacts/data_transformation/test.csv # Path to the testing data
  model_name: model.joblib # Name (serealize )of the model file like pickle. 

model_evaluation:
  root_dir: artifacts/model_evaluation # Root directory for model evaluation artifacts
  test_data_path: artifacts/data_transformation/test.csv # Path to the testing data
  model_path: artifacts/model_trainer/model.joblib # Path to the trained model
  metric_file_name: artifacts/model_evaluation/metrics.json # File to store evaluation metrics
