# Configuration file for the data ingestion pipeline
artifacts_roots: artifacts # Root directory for all artifacts

data_ingestion:
  root_dir: artifacts/data_ingestion # Root directory for data ingestion artifacts
  source_URL: https://github.com/krishnaik06/datasets/raw/refs/heads/main/winequality-data.zip  # URL to download the dataset
  local_data_file: artifacts/data_ingestion/winequality_data.zip # Local path where the data will be downloaded
  unzip_dir: artifacts/data_ingestion   # Directory where the data will be unzipped
  

data_validation:
  root_dir: artifacts/data_validation # Root directory for data validation artifacts
  unzip_data_dir: artifacts/data_ingestion/winequality-red.csv # Directory where the data is unzipped
  STATUS_FILE: artifacts/data_validation/status.txt # File to store validation status
  